<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লগইন এবং রেজিস্ট্রেশন</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/style.css">
</head>

<body>

    <div class="container">
        <div id="loginForm" class="form-container active">
            <h2>Welcome Back</h2>
            <p class="subtitle">Please sign in to your account</p>
            <form id="formLogin">
                <div class="form-group">
                    <label>Email or Username</label>
                    <input type="text" id="loginEmail" required placeholder="Enter your email or username">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" required placeholder="Enter your password">
                </div>
                <div id="loginError" class="error-msg"></div>
                <button type="submit" class="btn-submit">Sign In</button>
            </form>
            <div class="toggle-link">Don't have an account? <span onclick="toggleForm('register')">Register</span></div>
        </div>

        <div id="registerForm" class="form-container">
            <h2>Create Account</h2>
            <p class="subtitle">Sign up to get started</p>
            <form id="formRegister">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="regName" required placeholder="Enter your full name">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="regEmail" required placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="regPassword" required placeholder="Create a strong password">
                </div>
                <div id="regError" class="error-msg"></div>
                <button type="submit" class="btn-submit">Sign Up</button>
            </form>
            <div class="toggle-link">Already have an account? <span onclick="toggleForm('login')">Sign In</span></div>
        </div>
    </div>

    <script src="/assets/js/auth.js"></script>
</body>

</html>
