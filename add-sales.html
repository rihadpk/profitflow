<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Sale - Business Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/style.css">
</head>

<body>

    <div class="dashboard-wrapper">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <i class="fa-solid fa-chart-line"></i>
                <span>ProfitFlow</span>
            </div>
            <ul class="nav-list">
                <li class="nav-item">
                    <a href="dashboard.html" class="nav-link"><i class="fa-solid fa-table-columns"></i> Dashboard</a>
                </li>
                <li class="nav-item active">
                    <a href="add-sales.html" class="nav-link"><i class="fa-solid fa-cart-plus"></i> Add Sale</a>
                </li>
                <li class="nav-item">
                    <a href="sales-list.html" class="nav-link"><i class="fa-solid fa-list-check"></i> Sales List</a>
                </li>
                <li class="nav-item">
                    <a href="expenses.html" class="nav-link"><i class="fa-solid fa-receipt"></i> Expenses</a>
                </li>
                <li class="nav-item">
                    <a href="targets.html" class="nav-link"><i class="fa-solid fa-bullseye"></i> Targets</a>
                </li>
                <li class="nav-item">
                    <a href="reports.html" class="nav-link"><i class="fa-solid fa-chart-pie"></i> Reports</a>
                </li>
                <li class="nav-item">
                    <a href="settings.html" class="nav-link"><i class="fa-solid fa-gear"></i> Settings</a>
                </li>
            </ul>
        </aside>

        <main class="main-content">
            <header class="main-header">
                <h1>Add New Sale</h1>
                <div class="header-right">
                    <div class="user-profile">
                        <img id="headerUserImg"
                            src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=80&auto=format&fit=crop"
                            alt="User">
                        <span id="userNameDisplay">rihad</span>
                    </div>
                </div>
            </header>

            <section class="form-card-section">
                <div class="form-card-content">
                    <form id="addSalePageForm">
                        <div class="form-grid">
                            <div class="form-group full">
                                <label>Product Name</label>
                                <input type="text" id="inProduct" placeholder="e.g. Wireless Mouse" required>
                            </div>
                            <div class="form-group full">
                                <label>Customer Name / ID</label>
                                <input type="text" id="inCustomer" placeholder="e.g. Rahim Uddin" required>
                            </div>
                            <div class="form-group">
                                <label>Quantity</label>
                                <input type="number" id="inQty" value="1" min="1" required>
                            </div>
                            <div class="form-group">
                                <label>Delivery Charge (৳)</label>
                                <input type="number" id="inDelivery" value="0" min="0" required>
                            </div>
                            <div class="form-group">
                                <label>Cost Price (Unit ৳)</label>
                                <input type="number" id="inCost" min="0" required>
                            </div>
                            <div class="form-group">
                                <label>Selling Price (Unit ৳)</label>
                                <input type="number" id="inSell" min="0" required>
                            </div>
                        </div>
                        <button type="submit" class="btn-submit"><i class="fa-solid fa-plus"></i> Add to Sales</button>
                    </form>
                </div>
            </section>
            <footer class="site-footer">
                <p>&copy; 2026 Designed & Developed by <strong>Rihad</strong></p>
            </footer>
        </main>
    </div>

    <script src="/assets/js/main.js"></script>
</body>

</html>
