<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Business Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/style.css">
</head>

<body>

    <div class="dashboard-wrapper">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <i class="fa-solid fa-chart-line"></i>
                <span>ProfitFlow</span>
            </div>
            <ul class="nav-list">
                <li class="nav-item">
                    <a href="dashboard.html" class="nav-link"><i class="fa-solid fa-table-columns"></i> Dashboard</a>
                </li>
                <li class="nav-item">
                    <a href="add-sales.html" class="nav-link"><i class="fa-solid fa-cart-plus"></i> Add Sale</a>
                </li>
                <li class="nav-item">
                    <a href="sales-list.html" class="nav-link"><i class="fa-solid fa-list-check"></i> Sales List</a>
                </li>
                <li class="nav-item">
                    <a href="expenses.html" class="nav-link"><i class="fa-solid fa-receipt"></i> Expenses</a>
                </li>
                <li class="nav-item">
                    <a href="targets.html" class="nav-link"><i class="fa-solid fa-bullseye"></i> Targets</a>
                </li>
                <li class="nav-item">
                    <a href="reports.html" class="nav-link"><i class="fa-solid fa-chart-pie"></i> Reports</a>
                </li>
                <li class="nav-item active">
                    <a href="settings.html" class="nav-link"><i class="fa-solid fa-gear"></i> Settings</a>
                </li>
            </ul>
            <div class="sidebar-date">
                <div class="date-box">
                    <h4 id="displayDate">13 Jun 2026</h4>
                    <p id="displayDay">Saturday, 05:53 PM</p>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <header class="main-header">
                <h1>Account Settings</h1>
                <div class="header-right">
                    <div class="user-profile">
                        <img id="headerUserImg"
                            src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=80&auto=format&fit=crop"
                            alt="User">
                        <span id="userNameDisplay">rihad</span>
                    </div>
                </div>
            </header>

            <section class="form-card-section">
                <div class="form-card-content">
                    <h3>Update Profile Information</h3>
                    <form id="settingsForm">
                        <div class="form-grid">
                            <div class="form-group full profile-img-group">
                                <div class="current-img-box">
                                    <img id="profilePreview"
                                        src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=80&auto=format&fit=crop"
                                        alt="Profile Preview">
                                </div>
                                <div>
                                    <label>Profile Picture</label>
                                    <input type="file" id="inProfileImg" accept="image/*">
                                </div>
                            </div>
                            <div class="form-group full">
                                <label>Full Name</label>
                                <input type="text" id="inName" placeholder="Your Name" required>
                            </div>
                            <div class="form-group full">
                                <label>Email Address (Username)</label>
                                <input type="email" id="inEmail" readonly disabled style="background-color: #f1f5f9;">
                                <small style="color: #64748b;">Email/Username cannot be changed.</small>
                            </div>
                            <div class="form-group full">
                                <label>New Password</label>
                                <input type="password" id="inPassword"
                                    placeholder="Leave blank to keep current password">
                            </div>
                        </div>
                        <button type="submit" class="btn-submit"><i class="fa-solid fa-floppy-disk"></i> Save
                            Changes</button>
                    </form>
                </div>
            </section>
            <footer class="site-footer">
                <p>&copy; 2026 Designed & Developed by <strong>Rihad</strong></p>
            </footer>
        </main>
    </div>

    <script src="/assets/js/main.js"></script>
</body>

</html>
